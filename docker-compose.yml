# Development / evaluation stack.
#
# Before the first run:
#   cp .env.example .env      and edit the passwords
#   touch config.ini          (a bind-mounted file must exist, or Docker
#                              creates a DIRECTORY with that name)
#   docker compose up -d
#   docker compose exec writefreely-web writefreely --config
#
# See docs/docker.md for the full walkthrough.

volumes:
  web-state:
  db-data:

networks:
  external_writefreely:
  internal_writefreely:
    internal: true

services:
  writefreely-web:
    container_name: "writefreely-web"

    # Built from this checkout rather than pulled. The mount paths below are
    # the image's own layout, so a published tag that predates a change to
    # that layout would leave this file mounting a config the app never
    # reads. Building here keeps the two in step.
    #
    # To evaluate a release instead, replace build/image with
    #   image: "ghcr.io/josephquigley/writefreely-colophon-edition:latest"
    build:
      context: .
    image: writefreely:local

    volumes:
      - "web-state:/var/lib/writefreely"
      - "./config.ini:/var/lib/writefreely/config.ini"

    # Names this stack's service in the entrypoint's "generate a config"
    # message, which otherwise reads as the production stack's name.
    environment:
      - WRITEFREELY_SERVICE_HINT=writefreely-web

    networks:
      - "internal_writefreely"
      - "external_writefreely"

    ports:
      - "8080:8080"

    depends_on:
      writefreely-db:
        # Wait for the database to accept connections. A plain depends_on
        # only waits for the container to start, so the app would come up
        # first and fail its initial connection.
        condition: service_healthy

    restart: unless-stopped

  writefreely-db:
    container_name: "writefreely-db"
    # LinuxServer's image, matching docker-compose.prod.yml so both stacks
    # behave the same way. Its data directory is /config/databases, not
    # /var/lib/mysql -- the mount point below is the image's, not MariaDB's.
    #
    # No command: override here. This image boots through s6 init, which
    # expects to invoke the server itself, and it already defaults to
    # utf8mb4 / utf8mb4_general_ci. Server tuning goes in
    # /config/custom.cnf, which the image creates on first start.
    image: "lscr.io/linuxserver/mariadb:11.4.5"

    volumes:
      - "db-data:/config"

    networks:
      - "internal_writefreely"

    environment:
      - PUID=${PUID:-65534}
      - PGID=${PGID:-65534}
      - TZ=${TZ:-Etc/UTC}
      - MYSQL_DATABASE=writefreely
      - MYSQL_USER=writefreely
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}

    # This image ships mariadb-admin, not the official image's
    # healthcheck.sh.
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u writefreely -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

    restart: unless-stopped
