# Development / evaluation stack.
#
# Before the first run:
#   cp .env.example .env      and edit the passwords
#   mkdir -p data dbdata
#   docker compose up -d --build
#   docker compose run --rm app writefreely --config
#   docker compose up -d
#   docker compose exec app writefreely --create-admin youruser:yourpassword
#
# Mail is caught by Mailpit rather than delivered. Read it at
# http://localhost:8025 and see docs/docker.md for the config.ini block.
#
# See docs/docker.md for the full walkthrough.

name: writefreely-dev

networks:
  external:
  internal:
    internal: true

services:
  app:
    # Built from this checkout rather than pulled. The mount path below is
    # the image's own layout, so a published tag that predates a change to
    # that layout would leave this file mounting a config the app never
    # reads. Building here keeps the two in step.
    build:
      context: .
      args:
        WRITEFREELY_VERSION: ${WRITEFREELY_VERSION:-}
    image: writefreely:dev

    # Run as the host user, so the bind mount below needs no chown. The
    # image defaults to uid 1000; override in .env when yours differs.
    user: "${PUID:-1000}:${PGID:-1000}"

    # One directory holds config, keys, the database if SQLite is used,
    # and uploads.
    volumes:
      - ./data:/data

    networks:
      - internal
      - external

    ports:
      - "8080:8080"

    depends_on:
      db:
        # Wait for the database to accept connections. A plain depends_on
        # only waits for the container to start, so the app would come up
        # first and fail its initial connection.
        condition: service_healthy
      mailpit:
        condition: service_started

    restart: unless-stopped

  db:
    # LinuxServer's image, matching docker-compose.prod.yml so both stacks
    # behave the same way. Its data directory is /config/databases, not
    # /var/lib/mysql -- the mount point below is the image's, not MariaDB's.
    #
    # No command: override here. This image boots through s6 init, which
    # expects to invoke the server itself, and it already defaults to
    # utf8mb4 / utf8mb4_general_ci. Server tuning goes in
    # /config/custom.cnf, which the image creates on first start.
    image: "lscr.io/linuxserver/mariadb:11.4.5"

    # Deliberately NOT ./db: this repository already contains a Go package
    # at db/, and mounting over it writes MariaDB's state into the source
    # tree.
    volumes:
      - ./dbdata:/config

    networks:
      - internal

    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - MYSQL_DATABASE=writefreely
      - MYSQL_USER=writefreely
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}

    # This image ships mariadb-admin, not the official image's
    # healthcheck.sh.
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u writefreely -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

    restart: unless-stopped

  mailpit:
    # Catches everything the app sends instead of delivering it. Nothing
    # here leaves the machine, so password resets and invites can be
    # exercised without a real provider.
    image: axllent/mailpit:v1.28

    environment:
      # WriteFreely only builds an SMTP mailer when a username and password
      # are both set, so it always authenticates. Accept whatever it sends,
      # over an unencrypted connection on an internal network.
      - MP_SMTP_AUTH_ACCEPT_ANY=true
      - MP_SMTP_AUTH_ALLOW_INSECURE=true

    networks:
      - internal
      - external

    ports:
      # Web UI only. SMTP stays on the internal network.
      - "127.0.0.1:8025:8025"

    restart: unless-stopped

  backup:
    # Restic backups of the whole state directory, plus a database snapshot
    # taken consistently rather than copied out from under a live writer.
    # Off unless the profile is asked for:
    #
    #   docker compose --profile backup run --rm backup verify
    #   docker compose --profile backup up -d
    #
    # Built from this checkout rather than pulled, for the same reason app
    # is: the image and this file have to agree about paths.
    build:
      context: ./docker/backup
      dockerfile: Dockerfile.mysql
    image: writefreely-backup:dev

    # Database credentials are deliberately absent. The sidecar reads them
    # from config.ini in the state directory, so there is one copy of the
    # password rather than two that drift apart.
    environment:
      # Not marked required: compose interpolates every service whether or
      # not its profile is active, so a "?" here would force anyone running
      # the stack without backups to set them. `backup verify` reports them
      # missing instead.
      - RESTIC_REPOSITORY=${RESTIC_REPOSITORY:-}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:-}
      - RESTIC_CACHE_DIR=/cache
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - B2_ACCOUNT_ID=${B2_ACCOUNT_ID:-}
      - B2_ACCOUNT_KEY=${B2_ACCOUNT_KEY:-}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 3 * * *}
      - BACKUP_KEEP_DAILY=${BACKUP_KEEP_DAILY:-7}
      - BACKUP_KEEP_WEEKLY=${BACKUP_KEEP_WEEKLY:-4}
      - BACKUP_KEEP_MONTHLY=${BACKUP_KEEP_MONTHLY:-6}
      - BACKUP_KEEP_YEARLY=${BACKUP_KEEP_YEARLY:-2}
      - BACKUP_HEALTHCHECK_URL=${BACKUP_HEALTHCHECK_URL:-}
      - BACKUP_HEALTH_MAX_AGE=${BACKUP_HEALTH_MAX_AGE:-11520}
      - BACKUP_SITE=${BACKUP_SITE:-writefreely}
      # Where the restore checks whether the application is still running.
      - APP_URL=http://app:8080/
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}

    volumes:
      # Read-write, because restore installs into it.
      - ./data:/data
      # A snapshot is extracted here first, so nothing lands on top of live
      # data before someone has looked at it.
      - ./data-restore:/restore
      # Restic's cache would otherwise be rebuilt on every run, which makes
      # every prune re-download the repository index.
      - backup_cache:/cache

    depends_on:
      db:
        condition: service_healthy

    networks:
      - internal

    profiles: [backup]

    restart: unless-stopped

volumes:
  backup_cache:
