# Production stack. Pulls the published image rather than compiling on the
# server.
#
# Before the first run:
#   cp .env.example .env       and edit the passwords
#   mkdir -p data dbdata
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml run --rm app writefreely --config
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec app \
#       writefreely --create-admin youruser:yourpassword
#
# Mail needs a real provider. Configure SMTP or Mailgun under [email] in
# config.ini; see docs/docker.md.
#
# See docs/docker.md for the full walkthrough.

name: writefreely

services:
  app:
    # Override WRITEFREELY_IMAGE in .env to pin a release tag instead of
    # tracking latest.
    image: ${WRITEFREELY_IMAGE:-ghcr.io/josephquigley/writefreely-wisp:latest}

    # Run as the host user, so the bind mount below needs no chown. The
    # image defaults to uid 1000; override in .env when yours differs.
    user: "${PUID:-1000}:${PGID:-1000}"

    # One directory holds config, keys, the database if SQLite is used,
    # and uploads. Point [uploads] dir at /data/uploads so user content
    # lands here rather than in the read-only asset tree.
    volumes:
      - ./data:/data

    ports:
      - 127.0.0.1:8080:8080

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    # LinuxServer's image, as this stack has always used. Its PUID/PGID
    # handling is why: every piece of state here is a bind mount into this
    # directory, and this image adopts the ownership you ask for instead of
    # requiring the host directory be pre-chowned. Its data lives under
    # /config/databases, hence /config as the mount point.
    #
    # Pinned to the 11.4 LTS series rather than tracking latest, so a major
    # MariaDB upgrade is a deliberate act.
    image: lscr.io/linuxserver/mariadb:11.4.5

    # Deliberately NOT ./db: this repository already contains a Go package
    # at db/, and mounting over it writes MariaDB's state into the source
    # tree -- which is what the original file did.
    volumes:
      - ./dbdata:/config

    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - MYSQL_DATABASE=writefreely
      - MYSQL_USER=writefreely
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}

    # This image ships mariadb-admin, not the official image's
    # healthcheck.sh, so the check is written against what is actually here.
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u writefreely -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

    restart: unless-stopped

  backup:
    # Restic backups of the whole state directory, plus a database snapshot
    # taken consistently rather than copied out from under a live writer.
    # Off unless the profile is asked for:
    #
    #   docker compose --profile backup run --rm backup verify
    #   docker compose --profile backup up -d
    #
    # Pinned by digest on a real deployment. The sidecar's tags are branch
    # names, so an upgrade should be a deliberate edit here rather than a
    # tag moving underneath a running container.
    image: ${WRITEFREELY_BACKUP_IMAGE:-ghcr.io/josephquigley/writefreely-wisp-backup:main-mysql}

    # Database credentials are deliberately absent. The sidecar reads them
    # from config.ini in the state directory, so there is one copy of the
    # password rather than two that drift apart.
    environment:
      # Not marked required: compose interpolates every service whether or
      # not its profile is active, so a "?" here would force anyone running
      # the stack without backups to set them. `backup verify` reports them
      # missing instead.
      - RESTIC_REPOSITORY=${RESTIC_REPOSITORY:-}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:-}
      - RESTIC_CACHE_DIR=/cache
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - B2_ACCOUNT_ID=${B2_ACCOUNT_ID:-}
      - B2_ACCOUNT_KEY=${B2_ACCOUNT_KEY:-}
      - BACKUP_SCHEDULE=${BACKUP_SCHEDULE:-0 3 * * *}
      - BACKUP_KEEP_DAILY=${BACKUP_KEEP_DAILY:-7}
      - BACKUP_KEEP_WEEKLY=${BACKUP_KEEP_WEEKLY:-4}
      - BACKUP_KEEP_MONTHLY=${BACKUP_KEEP_MONTHLY:-6}
      - BACKUP_KEEP_YEARLY=${BACKUP_KEEP_YEARLY:-2}
      - BACKUP_HEALTHCHECK_URL=${BACKUP_HEALTHCHECK_URL:-}
      - BACKUP_HEALTH_MAX_AGE=${BACKUP_HEALTH_MAX_AGE:-11520}
      - BACKUP_SITE=${BACKUP_SITE:-writefreely}
      # Where the restore checks whether the application is still running.
      - APP_URL=http://app:8080/
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}

    volumes:
      # Read-write, because restore installs into it.
      - ./data:/data
      # A snapshot is extracted here first, so nothing lands on top of live
      # data before someone has looked at it.
      - ./data-restore:/restore
      # Restic's cache would otherwise be rebuilt on every run, which makes
      # every prune re-download the repository index.
      - backup_cache:/cache

    depends_on:
      db:
        condition: service_healthy

    profiles: [backup]

    restart: unless-stopped

volumes:
  backup_cache:
