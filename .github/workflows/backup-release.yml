name: Publish the backup sidecar images

# Separate from wisp-release.yml because the sidecar has its own lifecycle: an
# application release should not republish byte-identical backup images, and a
# change here should not need an application version bump.
#
# Tags are branch and short sha only. There is no semver for the sidecar:
# hosts pin by digest, which makes an upgrade a deliberate edit rather than a
# tag moving underneath a running deployment.
on:
  push:
    branches: [main, develop]
    paths:
      - 'docker/backup/**'
      - '.github/workflows/backup-release.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}-backup

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [sqlite, mysql]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.0.0

      # Required before the build: cache export is unsupported on the
      # default docker driver.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Log into ghcr.io
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.variant }}
            type=sha,format=short,suffix=-${{ matrix.variant }}
          # There is no release tag for the sidecar, so there is no latest.
          flavor: latest=false

      - name: Build and push
        uses: docker/build-push-action@v7.3.0
        with:
          context: ./docker/backup
          file: ./docker/backup/Dockerfile.${{ matrix.variant }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # arm64 is built under emulation, so a cold cache is slow.
          cache-from: type=gha
          cache-to: type=gha,mode=max
